<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Translate Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0e1621;
    --surface: #17212b;
    --surface-2: #1f2a36;
    --border: #2b3947;
    --text: #e8edf2;
    --text-dim: #8b9aa8;
    --accent: #3ea6ff;
    --accent-dim: #23455e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
  }
  .screen {
    max-width: 460px;
    margin: 0 auto;
    padding: 16px 16px 90px;
  }
  header {
    text-align: center;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  header p {
    font-size: 12px;
    color: var(--text-dim);
    margin: 4px 0 0;
  }

  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 14px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04121d;
    font-weight: 600;
  }
  .tab:disabled { opacity: .45; cursor: not-allowed; }

  .lang-row {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .lang-row::-webkit-scrollbar { display: none; }
  .lang-pill {
    flex: none;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    padding: 6px 10px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .lang-pill.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  .swap-wrap {
    display: flex;
    justify-content: center;
    margin: 10px 0;
  }
  .swap-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .swap-btn:active { transform: scale(0.94); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    resize: vertical;
  }
  .count {
    text-align: right;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .output-card {
    margin-top: 14px;
    min-height: 90px;
  }
  .output-text {
    font-size: 16px;
    white-space: pre-wrap;
    min-height: 24px;
  }
  .output-text.placeholder { color: var(--text-dim); }
  .check-text {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: none;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .action-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .action-btn:active { transform: scale(0.96); }

  .bottom-nav {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 10px 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-dim);
    font-size: 11px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .panel {
    display: none;
    margin-top: 14px;
  }
  .panel.open { display: block; }
  .panel-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .panel-item .from { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; }
  .empty-note { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }

  .status {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="screen">

  <header>
    <h1>Translate Bot</h1>
    <p>Myanmar &#8596; English, powered by Groq</p>
  </header>

  <div class="tabs">
    <button class="tab active">Text</button>
    <button class="tab" disabled>Images</button>
    <button class="tab" disabled>Documents</button>
    <button class="tab" disabled>Websites</button>
  </div>

  <div id="mainView">
    <div class="lang-row" id="sourceRow"></div>

    <div class="card">
      <textarea id="inputText" maxlength="5000" placeholder="Type text to translate..."></textarea>
      <div class="count"><span id="charCount">0</span> / 5000</div>
    </div>

    <div class="swap-wrap">
      <button class="swap-btn" id="swapBtn" title="Swap languages">&#8645;</button>
    </div>

    <div class="lang-row" id="targetRow"></div>

    <div class="card output-card">
      <div class="output-text placeholder" id="outputText">Translation appears here</div>
      <div class="check-text" id="checkText"></div>
      <div class="actions">
        <button class="action-btn" id="btnCopy">Copy</button>
        <button class="action-btn" id="btnSave">&#9733; Save</button>
        <button class="action-btn" id="btnCheck">&#8629; Check</button>
        <button class="action-btn" id="btnShare">Share</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="panel" id="historyPanel"></div>
  <div class="panel" id="savedPanel"></div>

</div>

<div class="bottom-nav">
  <button class="nav-item active" id="navMain">
    <span class="nav-icon">&#128270;</span>
    <span>Translate</span>
  </button>
  <button class="nav-item" id="navHistory">
    <span class="nav-icon">&#8635;</span>
    <span>History</span>
  </button>
  <button class="nav-item" id="navSaved">
    <span class="nav-icon">&#9734;</span>
    <span>Saved</span>
  </button>
</div>

<script>
// ---------- Fill this in ----------
const GROQ_API_KEY = "PUT_YOUR_GROQ_API_KEY_HERE";
const MODEL = "llama-3.3-70b-versatile";
// -----------------------------------

// Telegram Mini App setup — safe to call even if opened outside Telegram for testing.
try {
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
} catch (e) { /* not inside Telegram, fine for browser testing */ }

const SOURCE_LANGS = ["Detect language", "English", "Myanmar"];
const TARGET_LANGS = ["Myanmar", "English", "Chinese"];

let sourceLang = "Detect language";
let targetLang = "Myanmar";

const sourceRow = document.getElementById("sourceRow");
const targetRow = document.getElementById("targetRow");
const inputText = document.getElementById("inputText");
const charCount = document.getElementById("charCount");
const outputText = document.getElementById("outputText");
const checkText = document.getElementById("checkText");
const statusEl = document.getElementById("status");

function renderLangRow(container, options, current, onPick) {
  container.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "lang-pill" + (opt === current ? " active" : "");
    btn.textContent = opt;
    btn.onclick = () => onPick(opt);
    container.appendChild(btn);
  });
}

function renderAll() {
  renderLangRow(sourceRow, SOURCE_LANGS, sourceLang, (opt) => { sourceLang = opt; renderAll(); });
  renderLangRow(targetRow, TARGET_LANGS, targetLang, (opt) => { targetLang = opt; renderAll(); });
}
renderAll();

inputText.addEventListener("input", () => {
  charCount.textContent = inputText.value.length;
});

document.getElementById("swapBtn").onclick = () => {
  if (sourceLang === "Detect language") return; // nothing concrete to swap to
  const tmp = sourceLang;
  sourceLang = targetLang;
  targetLang = tmp;
  renderAll();
};

async function callGroq(systemPrompt, userText) {
  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + GROQ_API_KEY,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userText },
      ],
      temperature: 0.3,
    }),
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error("Groq API error: " + response.status + " " + errText);
  }
  const data = await response.json();
  return data.choices[0].message.content.trim();
}

let lastTranslation = "";

async function translate() {
  const text = inputText.value.trim();
  if (!text) return;

  outputText.classList.add("placeholder");
  outputText.textContent = "Translating...";
  checkText.style.display = "none";
  statusEl.textContent = "";

  const sourceNote = sourceLang === "Detect language" ? "auto-detect the source language" : `the source language is ${sourceLang}`;
  const systemPrompt =
    `You are a precise translator. Translate the user's text into ${targetLang}. ` +
    `${sourceNote}. Reply with ONLY the translation, no explanations, no quotes, no extra text.`;

  try {
    const result = await callGroq(systemPrompt, text);
    lastTranslation = result;
    outputText.classList.remove("placeholder");
    outputText.textContent = result;
    addHistory(text, result, sourceLang, targetLang);
  } catch (e) {
    outputText.classList.remove("placeholder");
    outputText.textContent = "";
    statusEl.textContent = "⚠️ Couldn't translate right now. Check your connection or API key.";
    console.error(e);
  }
}

let translateTimer = null;
inputText.addEventListener("input", () => {
  clearTimeout(translateTimer);
  translateTimer = setTimeout(translate, 700); // wait for a pause in typing
});

document.getElementById("btnCopy").onclick = async () => {
  if (!lastTranslation) return;
  try {
    await navigator.clipboard.writeText(lastTranslation);
    statusEl.textContent = "Copied.";
  } catch (e) {
    statusEl.textContent = "Couldn't copy — select the text manually.";
  }
};

document.getElementById("btnCheck").onclick = async () => {
  if (!lastTranslation) return;
  checkText.style.display = "block";
  checkText.textContent = "Checking...";
  try {
    const backPrompt = `Translate the user's text into ${sourceLang === "Detect language" ? "the original language it most likely came from" : sourceLang}. Reply with ONLY the translation.`;
    const back = await callGroq(backPrompt, lastTranslation);
    checkText.textContent = "Back-translation: " + back;
  } catch (e) {
    checkText.textContent = "Couldn't check right now.";
  }
};

document.getElementById("btnShare").onclick = () => {
  const shareText = inputText.value.trim() + "\n\n→ " + lastTranslation;
  try {
    if (window.Telegram && window.Telegram.WebApp && Telegram.WebApp.switchInlineQuery) {
      Telegram.WebApp.switchInlineQuery(shareText, ["users", "groups"]);
      return;
    }
  } catch (e) { /* fall through to clipboard */ }
  navigator.clipboard.writeText(shareText).then(() => {
    statusEl.textContent = "Copied — paste it anywhere to share.";
  });
};

// ---------- Local storage: history + saved ----------
function loadList(key) {
  try { return JSON.parse(localStorage.getItem(key) || "[]"); }
  catch (e) { return []; }
}
function saveList(key, list) {
  try { localStorage.setItem(key, JSON.stringify(list.slice(0, 50))); }
  catch (e) { /* storage full or unavailable, skip silently */ }
}

function addHistory(original, translated, from, to) {
  const list = loadList("history");
  list.unshift({ original, translated, from, to, time: Date.now() });
  saveList("history", list);
}

document.getElementById("btnSave").onclick = () => {
  if (!lastTranslation) return;
  const list = loadList("saved");
  list.unshift({ original: inputText.value.trim(), translated: lastTranslation, from: sourceLang, to: targetLang, time: Date.now() });
  saveList("saved", list);
  statusEl.textContent = "Saved.";
};

function renderPanel(panelEl, items, emptyMsg) {
  panelEl.innerHTML = "";
  if (items.length === 0) {
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = emptyMsg;
    panelEl.appendChild(p);
    return;
  }
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "panel-item";
    const fromDiv = document.createElement("div");
    fromDiv.className = "from";
    fromDiv.textContent = item.from + " → " + item.to;
    const origDiv = document.createElement("div");
    origDiv.textContent = item.original;
    const transDiv = document.createElement("div");
    transDiv.style.color = "var(--accent)";
    transDiv.style.marginTop = "4px";
    transDiv.textContent = item.translated;
    div.appendChild(fromDiv);
    div.appendChild(origDiv);
    div.appendChild(transDiv);
    panelEl.appendChild(div);
  });
}

// ---------- Bottom nav switching ----------
const mainView = document.getElementById("mainView");
const historyPanel = document.getElementById("historyPanel");
const savedPanel = document.getElementById("savedPanel");
const navMain = document.getElementById("navMain");
const navHistory = document.getElementById("navHistory");
const navSaved = document.getElementById("navSaved");

function showView(name) {
  mainView.style.display = name === "main" ? "block" : "none";
  historyPanel.classList.toggle("open", name === "history");
  savedPanel.classList.toggle("open", name === "saved");
  [navMain, navHistory, navSaved].forEach(n => n.classList.remove("active"));
  if (name === "main") navMain.classList.add("active");
  if (name === "history") { navHistory.classList.add("active"); renderPanel(historyPanel, loadList("history"), "No translations yet."); }
  if (name === "saved") { navSaved.classList.add("active"); renderPanel(savedPanel, loadList("saved"), "Nothing saved yet."); }
}

navMain.onclick = () => showView("main");
navHistory.onclick = () => showView("history");
navSaved.onclick = () => showView("saved");
</script>
</body>
</html>
